# The whole blog: a database, the API, the console, the site, and a reverse proxy that gets its own
# certificate.
#
# Caddy is here rather than nginx because it obtains and renews TLS itself given a domain and an
# email. That is the difference between "the deploy command succeeded" and "I have a website". The
# alternative is telling every user to install nginx and run certbot, which is the step where most
# of them stop.
#
# Ports 80 and 443 are the only ones published. The API, the console and the site are reachable
# only through Caddy on the compose network, so nothing is exposed that does not need to be.
#
# Two networks. "edge" has a fixed subnet and gives Caddy a fixed address, which is the one hop the
# API trusts for X-Forwarded-For. "db" is internal (no route out) and holds only the database and
# the API. Every container drops all capabilities and cannot gain new ones, and runs with a
# read-only root filesystem except the console, whose entrypoint rewrites files in /app at start.
# If 172.28.0.0/24 is already used on the host, set EDGE_SUBNET and EDGE_PROXY_IP (an address
# inside it) in .env.

services:
  postgres:
    image: postgres:19-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f # postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barakocms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db
    # The official image starts as root, fixes ownership of the data directory, then drops to the
    # postgres user. That needs these five capabilities and nothing else.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/baryodev/barako-cms:${API_TAG:-5.9.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=barakocms;Username=postgres;Password=${DB_PASSWORD}"
      JWT__Key: ${JWT_KEY:?set JWT_KEY in .env}
      InitialAdmin__Username: ${ADMIN_USERNAME:-admin}
      InitialAdmin__Password: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      # The console is the only browser origin that calls the API directly. The site never does:
      # it reads from the server side, over the compose network.
      CORS__AllowedOrigins: "https://${CONSOLE_DOMAIN:?set CONSOLE_DOMAIN in .env}"
      # The attendance demo fixture, which also arms a workflow that sends mail. Off.
      Seed__DemoContent: "false"
      Swagger__Enabled: "false"
      # Absolute links the API hands out, and the feed and sitemap it can serve.
      App__BaseUrl: "https://${SITE_DOMAIN:?set SITE_DOMAIN in .env}"
      Feeds__SiteUrl: "https://${SITE_DOMAIN}"
      # The names a request can legitimately carry: Caddy forwards the public domains, and the site
      # calls the service name from inside the network. Not "*", which core 6.0 refuses in Production.
      AllowedHosts: "${API_DOMAIN};${SITE_DOMAIN};api"
      # Caddy terminates TLS and forwards over http, so the API has to be told the original scheme
      # or it will build http:// links and refuse to set a Secure cookie.
      ForwardedHeaders__Enabled: "true"
      # Trust X-Forwarded-For from the Caddy container alone, at its fixed address on the edge
      # network. A wider range lets any client pick the IP the rate limits and audit log see.
      ForwardedHeaders__KnownProxies__0: "${EDGE_PROXY_IP:-172.28.0.10}"
    networks:
      - edge
      - db
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The image writes nothing to its own filesystem (see its Dockerfile). The runtime still wants
    # a temp directory. The image is chiseled, with no shell or curl, so it has no in-container
    # healthcheck; Caddy and the console wait on the container being up.
    read_only: true
    tmpfs:
      - /tmp

  console:
    image: ghcr.io/baryodev/barako-brew:${CONSOLE_TAG:-1.13.0}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Read by the browser, so it is the public API address, not the service name.
      NEXT_PUBLIC_API_URL: "https://${API_DOMAIN:?set API_DOMAIN in .env}"
      # The site, for the page block editor's schema. The site allows this console's origin below.
      NEXT_PUBLIC_PRESS_URL: "https://${SITE_DOMAIN}"
    networks:
      - edge
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Not read-only: entrypoint.sh writes the base path into the build output with sed -i at start.
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  site:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Server to server, inside the network. Never leaves the host.
      CMS_URL: "http://api:8080"
      SITE_URL: "https://${SITE_DOMAIN}"
      SITE_NAME: ${SITE_NAME:-barakoPress}
      SITE_TAGLINE: ${SITE_TAGLINE:-A blog on barakoCMS}
      # One secret for webhook keys and share sessions, at least 32 characters. An older .env with
      # only REVALIDATE_SECRET keeps working: it is passed on, and read while PRESS_SECRET is empty.
      # Compose refuses to start with neither.
      PRESS_SECRET: ${PRESS_SECRET:-}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:-${PRESS_SECRET:?set PRESS_SECRET in .env}}
      # Which origins a tenant's font stylesheet may be linked from. Empty is Google Fonts alone,
      # which is what a site rendered before there was a list.
      PRESS_FONT_ORIGINS: ${PRESS_FONT_ORIGINS:-}
      # Which origins a site's Umami script may be loaded from. Empty allows none, so no script renders.
      PRESS_SCRIPT_ORIGINS: ${PRESS_SCRIPT_ORIGINS:-}
      # The browser-facing http origins on localhost or *.localhost that images and media load from, such as http://api.localhost:8080.
      PRESS_MEDIA_ORIGINS: ${PRESS_MEDIA_ORIGINS:-}
      # Which browser origins may read the block schema. The console above.
      PRESS_CONSOLE_ORIGINS: ${PRESS_CONSOLE_ORIGINS:-https://${CONSOLE_DOMAIN}}
    networks:
      - edge
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      # Next writes its render cache here. Owned by the nextjs user the image runs as.
      - /app/.next/cache:uid=1001,gid=1001,size=256m
    # /api/health renders no page. A check of the home page can cache a 404 before the tenant is served.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0 # caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - site
      - api
      - console
    ports:
      - "80:80"
      - "443:443"
    networks:
      edge:
        ipv4_address: ${EDGE_PROXY_IP:-172.28.0.10}
    # The image runs as root, and with every other capability dropped, binding 80 and 443 needs this one.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      CONSOLE_DOMAIN: ${CONSOLE_DOMAIN}
      # Origins the blog's Content-Security-Policy allows, space separated, each https://host. Match
      # PRESS_FONT_ORIGINS, PRESS_SCRIPT_ORIGINS (the same origins, written as https://host separated by spaces; CSP_SCRIPT_ORIGINS is also allowed in connect-src) and the embed block's hosts. Frames default to the seven embedHosts players.
      CSP_FONT_ORIGINS: ${CSP_FONT_ORIGINS:-https://fonts.googleapis.com https://fonts.gstatic.com}
      CSP_SCRIPT_ORIGINS: ${CSP_SCRIPT_ORIGINS:-}
      CSP_FRAME_ORIGINS: ${CSP_FRAME_ORIGINS:-https://www.youtube-nocookie.com https://www.youtube.com https://youtube.com https://player.vimeo.com https://www.google.com https://open.spotify.com https://w.soundcloud.com}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env, Let us Encrypt needs it}
    volumes:
      # Root in this container has no DAC_OVERRIDE, so the Caddyfile must be world readable (0644).
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

networks:
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-172.28.0.0/24}
  # No route out of the host. Only the database and the API are on it.
  db:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
