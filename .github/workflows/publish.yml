# Publishes ghcr.io/baryodev/barako-press.
#
# Until this existed the renderer shipped as an npm package only, so every site had to build its own
# image. That is a real gap rather than a preference: BaryoDev/barakoCMS#959 converts barakocms.com
# onto "the published barakoCMS, barakoBrew and barakoPress images", and two of those three existed.
#
# Both architectures, always. Each is built on a runner of that architecture and pushed by digest,
# then joined into one manifest list, so a half-finished matrix cannot leave a tag pointing at one
# architecture. The VM this deploys to is Ampere, and an amd64-only image has bitten this project
# before.
#
# What the image contains is the reference app: the renderer as a running server, which is what a
# site deploys. The npm package stays the way a consumer composes their own.

name: Publish image

on:
  push:
    branches: ["master"]
    tags: ["v*"]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*)
              V="${GITHUB_REF#refs/tags/v}"
              # Anchored, because a `case` glob is not. An unanchored pattern matches `1.2.3$(id)`
              # and a value carrying a newline, and this one reaches a shell again as a tag list.
              [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
                echo "::error::tag v$V is not a version"; exit 1; }
              echo "version=$V" >> "$GITHUB_OUTPUT"
              echo "is_release=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
              echo "is_release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

  build:
    name: Build ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/BaryoDev/barakoPress
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,name=ghcr.io/baryodev/barako-press,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # An empty digest would make the merge below build a manifest out of nothing, so it fails here
      # rather than producing an image that resolves to no architectures.
      - name: Record the digest
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::build produced no usable digest, got '$DIGEST'"; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.is_release == 'true' && 'release' || 'dev' }} tags
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IS_RELEASE: ${{ needs.version.outputs.is_release }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Create the manifest list
        id: tags
        run: |
          set -euo pipefail
          IMG=ghcr.io/baryodev/barako-press
          REFS=""
          for arch in amd64 arm64; do
            F="/tmp/digests/$arch"
            [ -s "$F" ] || { echo "::error::no digest for $arch, refusing to publish a single-architecture image"; exit 1; }
            REFS="$REFS $IMG@$(cat "$F")"
          done
          if [ "$IS_RELEASE" = "true" ]; then
            TAGS="latest $VERSION"
          else
            TAGS="dev dev-${GITHUB_SHA}"
          fi
          ARGS=""
          for t in $TAGS; do ARGS="$ARGS --tag $IMG:$t"; done
          docker buildx imagetools create $ARGS $REFS
          echo "pushed: $TAGS" >> "$GITHUB_STEP_SUMMARY"

      # Checked on the pushed manifest rather than on the build configuration, because the
      # configuration being right is not evidence that the push was. A single-architecture image is
      # invisible until something on the other architecture tries to run it.
      - name: The pushed image carries both architectures
        run: |
          set -euo pipefail
          IMG=ghcr.io/baryodev/barako-press
          T="$( [ "$IS_RELEASE" = "true" ] && echo "$VERSION" || echo "dev-${GITHUB_SHA}" )"
          PLATFORMS=$(docker buildx imagetools inspect "$IMG:$T" --raw \
            | python3 -c "import sys,json; m=json.load(sys.stdin).get('manifests',[]); print(' '.join(sorted(f\"{x['platform']['os']}/{x['platform']['architecture']}\" for x in m if x.get('platform',{}).get('architecture') not in (None,'unknown'))))")
          echo "$IMG:$T carries: $PLATFORMS"
          case "$PLATFORMS" in
            *linux/amd64*) ;;
            *) echo "::error::no linux/amd64 in the pushed manifest"; exit 1 ;;
          esac
          case "$PLATFORMS" in
            *linux/arm64*) ;;
            *) echo "::error::no linux/arm64 in the pushed manifest"; exit 1 ;;
          esac
