# Publishes ghcr.io/baryodev/barako-press.
#
# Until this existed the renderer shipped as an npm package only, so every site had to build its own
# image. That is a real gap rather than a preference: BaryoDev/barakoCMS#959 converts barakocms.com
# onto "the published barakoCMS, barakoBrew and barakoPress images", and two of those three existed.
#
# Both architectures, always. Each is built on a runner of that architecture and pushed by digest,
# then joined into one manifest list, so a half-finished matrix cannot leave a tag pointing at one
# architecture. The VM this deploys to is Ampere, and an amd64-only image has bitten this project
# before.
#
# A second image, barako-press-source, carries the engine's source with its dependencies installed and
# nothing built (the `source` stage of the Dockerfile). Blocks are registered when the Next build runs,
# so a site with a plugin builds a derived image; this is what it builds from, so it needs no checkout
# of this repository (#166). It is tagged exactly like the engine image.
#
# What the image contains is the reference app: the renderer as a running server, which is what a
# site deploys. The npm package stays the way a consumer composes their own.
#
# Both images are signed with cosign (keyless) and attested, by digest, before the floating tags
# (latest, dev) are copied from that digest. Only master and version tags publish.

name: Publish image

on:
  push:
    branches: ["master"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing version tag to build and publish, e.g. v0.7.0. Empty publishes this branch as dev."
        required: false
        default: ""

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      is_release: ${{ steps.v.outputs.is_release }}
      move_latest: ${{ steps.v.outputs.move_latest }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      # The full history is fetched so the release check below can tell whether a tagged commit is on
      # master. The token is not kept in the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # A dispatched tag names a release that has no image. That happens because this workflow was
          # written after v0.7.0 was tagged, so the tag push never fired it. Dispatching against the
          # tag itself does not work either: a dispatch runs the workflow file as it exists at that
          # ref, and at v0.7.0 this file does not exist. So the dispatch runs from here and the build
          # checks the tag out, which builds that release's source with today's machinery.
          if [ -n "${INPUT_TAG:-}" ]; then
            V="${INPUT_TAG#v}"
            RELEASE=true
            # Backfilling does not move `latest`. The newest release is whatever last pushed a tag,
            # and an older one publishing its image is not a statement that it is current.
            LATEST=false
          else
            case "$GITHUB_REF" in
              refs/tags/v*) V="${GITHUB_REF#refs/tags/v}"; RELEASE=true; LATEST=true ;;
              *) V="0.0.0-dev.${GITHUB_SHA::7}"; REF="$GITHUB_SHA"; RELEASE=false; LATEST=false ;;
            esac
          fi
          if [ "$RELEASE" = true ]; then
            # A prerelease (a hyphen in the version) never moves `latest`.
            case "$V" in *-*) LATEST=false ;; esac
            # Anchored, because a `case` glob is not. An unanchored pattern matches `1.2.3$(id)`
            # and a value carrying a newline, and this one reaches a shell again as a tag list.
            [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
              echo "::error::'$V' is not a version"; exit 1; }
            # A release is built from a commit on master. A tag on any other branch publishes nothing.
            TAGGED=$(git rev-parse --verify "refs/tags/v$V^{commit}" 2>/dev/null) || {
              echo "::error::tag v$V does not exist"; exit 1; }
            git merge-base --is-ancestor "$TAGGED" refs/remotes/origin/master || { echo "::error::v$V is not on master, refusing to publish a release from it"; exit 1; }
            # A pushed tag is built from the commit that triggered the run, and the build checks out
            # exactly the commit checked here, so a tag moved after this point changes nothing.
            case "$GITHUB_REF" in
              refs/tags/v*) [ "$TAGGED" = "$GITHUB_SHA" ] || { echo "::error::v$V no longer points at the commit that triggered this run"; exit 1; } ;;
            esac
            REF="$TAGGED"
          fi
          {
            echo "version=$V"
            echo "is_release=$RELEASE"
            echo "move_latest=$LATEST"
            echo "ref=$REF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }} ${{ matrix.arch }}
    needs: version
    # Only master and version tags publish. A manual run from any other branch builds nothing, so it
    # cannot push an image that is signed as that branch.
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: barako-press, target: run, arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { image: barako-press, target: run, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { image: barako-press-source, target: source, arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { image: barako-press-source, target: source, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/BaryoDev/barakoPress
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
          outputs: type=image,name=ghcr.io/baryodev/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      # An empty digest would make the merge below build a manifest out of nothing, so it fails here
      # rather than producing an image that resolves to no architectures.
      - name: Record the digest
        run: |
          set -euo pipefail
          DIGEST="${{ steps.build.outputs.digest }}"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "::error::build produced no usable digest, got '$DIGEST'"; exit 1 ;;
          esac
          mkdir -p /tmp/digests
          echo "$DIGEST" > "/tmp/digests/${{ matrix.image }}-${{ matrix.arch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.version.outputs.is_release == 'true' && 'release' || 'dev' }} tags
    needs: [version, build]
    runs-on: ubuntu-latest
    # One publish per version at a time, so a tag push and a backfill of the same version cannot overlap.
    concurrency:
      group: publish-image-${{ needs.version.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      # Keyless signing and provenance ask GitHub for an OIDC token. Only this job holds them.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IS_RELEASE: ${{ needs.version.outputs.is_release }}
      MOVE_LATEST: ${{ needs.version.outputs.move_latest }}
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      # The manifest lists are made under a tag that never moves: the version for a release, and
      # dev-<sha> for a master build. The floating tags (latest, dev) are copied from the verified
      # digest at the end of the job, after the images are signed and attested.
      #
      # Each manifest's digest is resolved here, once, and checked for shape. Every later step uses
      # that digest: the architecture check, the signature, the attestation, the verifies and the
      # floating tag copy. None of them resolves a tag again.
      - name: Create the manifest lists
        id: manifest
        run: |
          set -euo pipefail
          T="$( [ "$IS_RELEASE" = "true" ] && echo "$VERSION" || echo "dev-${GITHUB_SHA}" )"
          for image in barako-press barako-press-source; do
            IMG=ghcr.io/baryodev/$image
            REFS=()
            for arch in amd64 arm64; do
              F="/tmp/digests/$image-$arch"
              [ -s "$F" ] || { echo "::error::no digest for $image $arch, refusing to publish a single-architecture image"; exit 1; }
              D=$(cat "$F")
              [[ "$D" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::digest for $image $arch is not a sha256 digest: '$D'"; exit 1; }
              REFS+=("$IMG@$D")
            done
            docker buildx imagetools create --tag "$IMG:$T" "${REFS[@]}"
            DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$IMG:$T" | jq -r '.digest')
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::$IMG:$T resolved to '$DIGEST', not a sha256 digest"; exit 1; }
            echo "${image//-/_}_digest=$DIGEST" >> "$GITHUB_OUTPUT"
            echo "pushed $image: $T" >> "$GITHUB_STEP_SUMMARY"
          done

      # Checked on the pushed manifest rather than on the build configuration, because the
      # configuration being right is not evidence that the push was. A single-architecture image is
      # invisible until something on the other architecture tries to run it.
      - name: The pushed images carry both architectures
        env:
          PRESS_DIGEST: ${{ steps.manifest.outputs.barako_press_digest }}
          SOURCE_DIGEST: ${{ steps.manifest.outputs.barako_press_source_digest }}
        run: |
          set -euo pipefail
          for pair in "barako-press $PRESS_DIGEST" "barako-press-source $SOURCE_DIGEST"; do
            read -r image DIGEST <<< "$pair"
            IMG=ghcr.io/baryodev/$image
            PLATFORMS=$(docker buildx imagetools inspect "$IMG@$DIGEST" --raw \
              | python3 -c "import sys,json; m=json.load(sys.stdin).get('manifests',[]); print(' '.join(sorted(f\"{x['platform']['os']}/{x['platform']['architecture']}\" for x in m if x.get('platform',{}).get('architecture') not in (None,'unknown'))))")
            echo "$IMG@$DIGEST carries: $PLATFORMS"
            case "$PLATFORMS" in
              *linux/amd64*) ;;
              *) echo "::error::no linux/amd64 in the pushed manifest of $image"; exit 1 ;;
            esac
            case "$PLATFORMS" in
              *linux/arm64*) ;;
              *) echo "::error::no linux/arm64 in the pushed manifest of $image"; exit 1 ;;
            esac
          done

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      # Signed by digest, never by tag: a tag can move after the signature is made. The digest is the
      # one the manifest step resolved and the architecture check read, so the image that was checked
      # is the image that is signed. jq is on the ubuntu-latest runner image. The identity names this
      # workflow file and the refs that publish (master and version tags), so a run from any other ref
      # does not verify.
      - name: Sign every published image and verify the signature
        env:
          IDENTITY_REGEXP: '^https://github\.com/BaryoDev/barakoPress/\.github/workflows/publish\.yml@refs/(heads/master|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$'
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          PRESS_DIGEST: ${{ steps.manifest.outputs.barako_press_digest }}
          SOURCE_DIGEST: ${{ steps.manifest.outputs.barako_press_source_digest }}
        run: |
          set -euo pipefail
          for pair in "barako-press $PRESS_DIGEST" "barako-press-source $SOURCE_DIGEST"; do
            read -r NAME DIGEST <<< "$pair"
            cosign sign --yes "ghcr.io/baryodev/$NAME@$DIGEST"
            cosign verify \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "ghcr.io/baryodev/$NAME@$DIGEST" > /dev/null
          done

      - name: Attest build provenance for barako-press
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/baryodev/barako-press
          subject-digest: ${{ steps.manifest.outputs.barako_press_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest build provenance for barako-press-source
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/baryodev/barako-press-source
          subject-digest: ${{ steps.manifest.outputs.barako_press_source_digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Verify the provenance attestation of every published image
        env:
          IDENTITY_REGEXP: '^https://github\.com/BaryoDev/barakoPress/\.github/workflows/publish\.yml@refs/(heads/master|tags/v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?)$'
          OIDC_ISSUER: https://token.actions.githubusercontent.com
          PRESS_DIGEST: ${{ steps.manifest.outputs.barako_press_digest }}
          SOURCE_DIGEST: ${{ steps.manifest.outputs.barako_press_source_digest }}
        run: |
          set -euo pipefail
          for pair in "barako-press $PRESS_DIGEST" "barako-press-source $SOURCE_DIGEST"; do
            read -r NAME DIGEST <<< "$pair"
            cosign verify-attestation --type slsaprovenance1 \
              --certificate-identity-regexp "$IDENTITY_REGEXP" \
              --certificate-oidc-issuer "$OIDC_ISSUER" \
              "ghcr.io/baryodev/$NAME@$DIGEST" > /dev/null
          done

      # The last step that touches ghcr: everything above passed for these digests. The floating tags
      # are copied from the verified digest, so they carry the signed image. A backfill of an older
      # release moves neither tag.
      - name: Move the floating tags to the verified images
        env:
          PRESS_DIGEST: ${{ steps.manifest.outputs.barako_press_digest }}
          SOURCE_DIGEST: ${{ steps.manifest.outputs.barako_press_source_digest }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" = "true" ]; then
            [ "$MOVE_LATEST" = "true" ] || { echo "backfill, no floating tag moved"; exit 0; }
            FLOAT=latest
          else
            FLOAT=dev
          fi
          for pair in "barako-press $PRESS_DIGEST" "barako-press-source $SOURCE_DIGEST"; do
            read -r NAME DIGEST <<< "$pair"
            docker buildx imagetools create --tag "ghcr.io/baryodev/$NAME:$FLOAT" "ghcr.io/baryodev/$NAME@$DIGEST"
            # Read the tag back: it has to resolve to the digest that was signed and verified.
            ACTUAL=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "ghcr.io/baryodev/$NAME:$FLOAT" | jq -r '.digest')
            [ "$ACTUAL" = "$DIGEST" ] || { echo "::error::$NAME:$FLOAT resolves to '$ACTUAL', not the verified $DIGEST"; exit 1; }
          done
          echo "moved :$FLOAT to the verified images" >> "$GITHUB_STEP_SUMMARY"

  close-milestone:
    name: Close the release milestone
    needs: [version, publish]
    if: needs.version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Close the milestone and move what is left
        run: |
          set -euo pipefail
          # barakocms.com/roadmap shows the first open milestone per repository and never looks at
          # releases, so a milestone left open after its release keeps the page on an old version.
          # Checked before anything else, because the value is matched against milestone titles.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]] || {
            echo "::error::'$VERSION' is not a version"; exit 1; }
          # Prereleases leave their milestone open: the final release closes it.
          case "$VERSION" in *-*) echo "::notice::$VERSION is a prerelease; milestone left open."; exit 0 ;; esac
          # One "number title" line per milestone.
          milestones() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/milestones?state=$1&per_page=100" \
              --jq '.[] | "\(.number) \(.title)"'
          }
          number_of() { awk -v t="$1" '{ n = $1; sub(/^[0-9]+ /, "") } $0 == t { print n }'; }
          open_list=$(milestones open)
          ms=$(number_of "$VERSION" <<< "$open_list")
          if [ -z "$ms" ]; then
            echo "::notice::No open milestone named $VERSION."
            exit 0
          fi
          open=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?milestone=$ms&state=open&per_page=100" --jq '.[].number')
          if [ -n "$open" ]; then
            # Unfinished items roll forward to the lowest open milestone above this version, or to
            # the next minor when there is none, so nothing drops off the roadmap.
            next=""
            while read -r t; do
              if [ "$t" != "$VERSION" ] && [ "$(printf '%s\n%s\n' "$VERSION" "$t" | sort -V | head -1)" = "$VERSION" ]; then
                next="$t"; break
              fi
            done < <(awk '{ sub(/^[0-9]+ /, ""); print }' <<< "$open_list" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
            if [ -z "$next" ]; then
              IFS=. read -r major minor _ <<< "$VERSION"
              next="$major.$((minor + 1)).0"
            fi
            # The next minor may exist already, closed. Reopen it rather than fail on a duplicate.
            next_ms=$(milestones all | number_of "$next")
            if [ -z "$next_ms" ]; then
              next_ms=$(gh api -X POST "repos/$GITHUB_REPOSITORY/milestones" -f title="$next" --jq '.number')
            else
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$next_ms" -f state=open >/dev/null
            fi
            [[ "$next_ms" =~ ^[0-9]+$ ]] || { echo "::error::no milestone number for $next"; exit 1; }
            for n in $open; do
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$n" -F milestone="$next_ms" >/dev/null
              echo "Moved #$n to $next."
            done
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/milestones/$ms" -f state=closed >/dev/null
          echo "::notice::Closed milestone $VERSION."
