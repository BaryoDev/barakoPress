# Deploys press.baryo.dev through BaryoVM, the same tool used to run that VM by hand.
#
# The deploy logic lives in the tool rather than in a script on the box that nothing tests, so a
# change to how a stack is deployed is made in one place.
#
# THE TRADE, STATED BECAUSE IT IS REAL. This job's key is not pinned to a forced command the way
# barakoCMS's release keys are. BaryoVM runs arbitrary remote commands by design and cannot work
# behind one, which is why BaryoDev/barakoCMS#985 was closed unmerged rather than shipped. So
# PRESS_DEPLOY_KEY can reach anything the `opc` user can, on every stack that VM hosts, which
# includes playground, colormefun and rckoronadal. It is a separate key and can be revoked on its
# own without touching the others. BaryoDev/BaryoVM#98 is what would let a CI key stay restricted;
# until it lands, adding another stack to this path means widening that reach again.

name: Deploy press.baryo.dev

on:
  workflow_dispatch:

# One deploy at a time, queued rather than cancelled: a half-applied deploy is worse than a late one.
concurrency:
  group: deploy-press
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Release the barakopress stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: press-baryo-dev
      url: https://press.baryo.dev
    steps:
      # No persisted credentials. This job downloads a binary and then runs it against a remote
      # host, so it should leave no git token in the checkout for that binary to find. The checksum
      # proves the download is the published asset, which is not the same as proving it is
      # harmless. The example this was taken from does the same on the job that reads a registry,
      # and copying the pattern without this line was an omission.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Pinned to a version, and the checksum is verified against the release's own checksums.txt.
      # An install step that curls a tarball and runs it is a supply chain step whatever else it is
      # called.
      #
      # REQUIRES a release carrying host key verification (BaryoVM#96) and strict mode (#97). 0.3.0
      # predates both: run this against it and the strict variable is ignored, every deploy trusts
      # whatever answers, and nothing says so.
      - name: Install BaryoVM
        run: |
          set -euo pipefail
          base="https://github.com/BaryoDev/BaryoVM/releases/download/v${BARYOVM_VERSION}"
          asset="baryovm_${BARYOVM_VERSION}_linux_amd64.tar.gz"
          cd /tmp
          # Downloaded under its own name, not renamed. sha256sum -c reads the filename out of
          # checksums.txt and checks the file on disk by that name, so fetching it as
          # baryovm.tar.gz fails every run and reads as a tampered download rather than a naming
          # mistake.
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/checksums.txt"
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "${asset}" -C /tmp baryovm
          sudo install -m 0755 /tmp/baryovm /usr/local/bin/baryovm
          baryovm version
        env:
          BARYOVM_VERSION: "0.4.0"

      # Pinned from a file in this repository, not fetched at deploy time. An ssh-keyscan here would
      # trust whatever answered, which is the thing strict mode exists to refuse. Changing the VM's
      # identity now needs a reviewed commit.
      - name: Pin the VM host key
        run: |
          set -euo pipefail
          mkdir -p ~/.baryovm
          install -m 0600 .github/baryovm/known_hosts ~/.baryovm/known_hosts
          ssh-keygen -lf ~/.baryovm/known_hosts

      - name: Write the deploy key
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "${DEPLOY_KEY}" > ~/.ssh/press_deploy_key
          chmod 0600 ~/.ssh/press_deploy_key
        env:
          DEPLOY_KEY: ${{ secrets.PRESS_DEPLOY_KEY }}

      # A runner has no fleet, so the VM and stack are registered each run. BaryoDev/BaryoVM#84, a
      # committed project file, is what would remove this; until it lands the registration lives
      # here.
      #
      # --sudo and --file match how the stack was registered by hand: the site alone, on a host that
      # already runs barakoCMS and already terminates TLS with nginx. The bundled compose.yml brings
      # its own Caddy and would fight nginx for 80 and 443.
      - name: Register the VM and stack
        run: |
          set -euo pipefail
          baryovm vm add oracle \
            --host "${ORACLE_HOST}" \
            --user "${ORACLE_USER}" \
            --key ~/.ssh/press_deploy_key
          baryovm stack add barakopress \
            --vm oracle \
            --path /opt/barakopress \
            --file compose.site.yml \
            --release-file baryovm.site.json \
            --sudo \
            --health-url http://127.0.0.1:3007/
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}

      # `release` syncs the source, builds the image on the VM and composes up, which is what this
      # site needs: it builds from source rather than pulling a published image.
      #
      # No --no-backup here. That flag belongs to a breakable tier with a disposable database, and
      # this is a live site.
      #
      # Strict host keys: an unknown host is an error rather than a key learned on faith. A runner
      # has no memory between runs, so without this every deploy would trust whatever answered.
      - name: Release the stack
        run: baryovm stack release barakopress
        env:
          BARYOVM_STRICT_HOST_KEYS: "1"

      # The deploy is not finished when the command exits. This proves the site a visitor reaches is
      # answering, through nginx and the real certificate, not just that a container started.
      - name: Prove it from the public URL
        run: |
          set -euo pipefail
          # Each request is bounded and so is the loop. Without a curl timeout a stalled DNS or TCP
          # connect has no limit of its own, so twenty attempts can run far past the window this
          # claims and hold the deploy concurrency group until the job's own timeout. The deadline
          # is wall clock rather than a count of attempts, so the message cannot lie about it.
          DEADLINE=$(( $(date +%s) + 200 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --connect-timeout 5 --max-time 15 https://press.baryo.dev/ || true)
            [ "$code" = "200" ] && { echo "press.baryo.dev answered 200"; exit 0; }
            sleep 10
          done
          echo "::error::press.baryo.dev did not answer 200 within 200 seconds (last code: ${code:-none})"
          exit 1
