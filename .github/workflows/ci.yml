# barakoPress CI.
#
# The engine is a package before it is an app, so the build that matters is not this repo's own.
# It is a separate app installing the packed tarball and rendering a content model that is not the
# blog blueprint, because barakoCMS content types are defined at runtime and a client's posts are
# as likely to be `article` with a `Headline`. Every defect worth catching here was found that way:
# a peer floor that admitted a Next it cannot compile on, static export mode missing four things,
# and a blog shape compiled into nine files.
name: ci

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: House style
        run: |
          # An em dash or en dash in anything that ships. A local hook catches this while writing;
          # this catches it when the hook was not running. The scan is the whole tree minus the
          # generated parts, because the earlier version listed src, app, .github and three markdown
          # files, so next.config.ts, press.config.ts, the Dockerfile, compose.yml and AGENTS.md
          # were never read, and those are as likely to carry prose. -I so a binary asset added to
          # public/ later cannot fail this on a stray byte pair.
          if grep -rlIP '[\x{2014}\x{2013}]' . \
               --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git \
               --exclude-dir=dist --exclude=package-lock.json --exclude='*.tsbuildinfo' \
               2>/dev/null; then
            echo "the files above contain an em dash or en dash"
            exit 1
          fi

      - name: The package builds, and has an entry point and types
        # Before the typecheck, not after: app/ imports barakopress by name, so it resolves through
        # dist/index.d.ts like a consumer does, and tsc cannot find it until this has run. The
        # prepare script means npm ci has already done it; this asserts what came out.
        run: |
          npm run build:package
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f dist/markdown.js
          test -f dist/markdown.d.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        # The engine's own build proves almost nothing, which is why the consumer job below exists.
        # These cover the parts a build cannot see: that overriding one theme token keeps the rest,
        # that the generated body stylesheet stays inside its scope, and that read time is derived
        # rather than typed.
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Relative imports carry a file extension
        # The package is type: module, so `./config.js` is the specifier ESM asks for and `./config`
        # is not. A default Next build does not care: measured on 16.3.4, the extensionless package
        # builds and serves identically under Turbopack and webpack, because Next's webpack config
        # sets fullySpecified: false for .m?js. What does care is a consumer on webpack with
        # experimental.fullySpecified: true, which fails on the extensionless build and passes on
        # this one, and Node's own resolver under serverExternalPackages, which refuses the
        # extensionless dist at dist/config (it refuses this build too, at next/link, so the
        # extensions are necessary there and not sufficient). So this keeps one form in the tree.
        #
        # -o so the extension filter applies per specifier and not per line, either quote because
        # nothing here enforces one, and a bare `import "./x"` counts: all three were missed before.
        run: |
          if grep -rnoE "(from|import\(|^[[:space:]]*import)[[:space:]]*['\"]\.\.?/[^'\"]*['\"]" src \
               | grep -vE "\.(js|css|json)['\"]"; then
            echo "the relative imports above need a file extension"
            exit 1
          fi

      - name: The reference app builds with no CMS reachable
        # The image is built without a CMS on purpose, so this is the real case, not a degraded one.
        # It has failed twice: the sitemap and then the feed threw instead of returning empty.
        env:
          CMS_URL: http://127.0.0.1:1
        run: npm run build

      - name: One container answers two hosts, and keeps answering with the CMS stopped
        # The reference app is a request-time site, built above with no CMS and no site values. This
        # starts it against a stand-in CMS holding two tenants and checks each host renders as itself,
        # a host with no tenant is a 404, a purge stays inside its tenant, and a purged tenant still
        # answers 200 as itself once the CMS is gone.
        run: scripts/two-hosts.sh

  consumer:
    # The test that matters: can somebody else install this and render their own content model.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci
      - name: Pack the engine
        run: |
          # prepare builds dist on npm ci, and again before the tarball is made, so it is never stale.
          npm pack --pack-destination /tmp
          # A changing name, because npm caches a file: tarball by path and version. Reinstalling
          # the same name silently serves the old code, which once made a fixed bug look unfixed.
          mv /tmp/barakopress-*.tgz "/tmp/engine-$GITHUB_SHA.tgz"

      - name: Start a CMS and give it a model that is not the blueprint
        run: |
          cat > /tmp/compose.yml <<'YAML'
          services:
            postgres:
              image: postgres:16-alpine
              environment:
                POSTGRES_DB: barakocms
                POSTGRES_USER: postgres
                POSTGRES_PASSWORD: ci-not-a-secret
              healthcheck:
                test: ["CMD-SHELL", "pg_isready -U postgres"]
                interval: 5s
                retries: 20
            api:
              image: ghcr.io/baryodev/barako-cms:4.0.1
              depends_on: { postgres: { condition: service_healthy } }
              ports: ["5099:8080"]
              environment:
                ASPNETCORE_ENVIRONMENT: Production
                ConnectionStrings__DefaultConnection: "Host=postgres;Database=barakocms;Username=postgres;Password=ci-not-a-secret"
                JWT__Key: "ci-only-key-that-is-long-enough-to-pass-the-guard"
                InitialAdmin__Username: admin
                InitialAdmin__Password: ci-not-a-secret
                Seed__DemoContent: "false"
          YAML
          docker compose -f /tmp/compose.yml up -d
          for i in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5099/health)" = "200" ] && break
            sleep 3
          done
          curl --fail --silent -o /dev/null http://localhost:5099/health

          TOKEN=$(curl -s -X POST http://localhost:5099/api/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci-not-a-secret"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).token')

          # Deliberately none of the blueprint's names.
          curl --fail --silent -o /dev/null -X POST http://localhost:5099/api/content-types \
            -H 'content-type: application/json' -H "authorization: Bearer $TOKEN" -d '{
              "name":"article","displayName":"Article","isPubliclyDeliverable":true,
              "fields":[
                {"name":"Headline","displayName":"Headline","type":"string","isRequired":true},
                {"name":"Permalink","displayName":"Permalink","type":"slug","isRequired":true},
                {"name":"Standfirst","displayName":"Standfirst","type":"text"},
                {"name":"Story","displayName":"Story","type":"markdown","isRequired":true},
                {"name":"RunDate","displayName":"Run date","type":"datetime"}]}'

          curl --fail --silent -o /dev/null -X POST http://localhost:5099/api/contents \
            -H 'content-type: application/json' -H "authorization: Bearer $TOKEN" -d '{
              "contentType":"article","status":"Published",
              "data":{"Headline":"An article, not a post","Permalink":"ci-article",
                      "Standfirst":"Different type, different field names.",
                      "Story":"## It renders\n\nThe engine was told the names, not taught them.",
                      "RunDate":"2026-01-01T00:00:00Z"}}'

          # A page type that is not the blueprint's either, with its blocks in a json field.
          curl --fail --silent -o /dev/null -X POST http://localhost:5099/api/content-types \
            -H 'content-type: application/json' -H "authorization: Bearer $TOKEN" -d '{
              "name":"landing","displayName":"Landing","isPubliclyDeliverable":true,
              "fields":[
                {"name":"Heading","displayName":"Heading","type":"string","isRequired":true},
                {"name":"Path","displayName":"Path","type":"slug","isRequired":true},
                {"name":"Sections","displayName":"Sections","type":"json"}]}'

          curl --fail --silent -o /dev/null -X POST http://localhost:5099/api/contents \
            -H 'content-type: application/json' -H "authorization: Bearer $TOKEN" -d '{
              "contentType":"landing","status":"Published",
              "data":{"Heading":"A landing page","Path":"ci-landing","Sections":[
                {"type":"richText","props":{"markdown":"Blocks in *order*."}},
                {"type":"columns","props":{"columns":[
                  [{"type":"callToAction","props":{"heading":"Nested call","label":"Go","href":"/contact-from-a-block"}}],
                  [{"type":"callToAction","props":{"heading":"Unsafe call","label":"No","href":"javascript:alert(1)"}}]]}},
                {"type":"collection","props":{"collection":"post","limit":3,"heading":"Latest writing"}},
                {"type":"notRegistered","props":{}}]}}'

      - name: Build a consumer against it
        run: |
          mkdir -p /tmp/consumer/app/writing/'[slug]' && cd /tmp/consumer
          cat > package.json <<JSON
          { "name":"consumer","private":true,
            "dependencies":{"barakopress":"file:/tmp/engine-$GITHUB_SHA.tgz",
              "next":"^16.0.0","react":"^19.0.0","react-dom":"^19.0.0"},
            "devDependencies":{"typescript":"^5.6.0","@types/react":"^19.0.0","@types/node":"^22.0.0"} }
          JSON
          cat > next.config.ts <<'TS'
          import type { NextConfig } from "next";
          // No transpilePackages, and its absence is the assertion: the published package compiles
          // itself, so a consumer installs it and configures nothing.
          const config: NextConfig = {};
          export default config;
          TS
          cat > tsconfig.json <<'JSON'
          { "compilerOptions": { "target":"ES2022","lib":["dom","ES2022"],"strict":true,"noEmit":true,
            "module":"esnext","moduleResolution":"bundler","jsx":"preserve","esModuleInterop":true,
            "skipLibCheck":true,"isolatedModules":true,"plugins":[{"name":"next"}],
            "paths":{"@/*":["./*"]} },
            "include":["next-env.d.ts","**/*.ts","**/*.tsx",".next/types/**/*.ts"] }
          JSON
          cat > press.config.ts <<'TS'
          import { createBlockRegistry, defineConfig } from "barakopress";
          export const config = defineConfig({
            types: { post: "article", author: undefined, category: undefined, page: "landing" },
            fields: { title: "Headline", slug: "Permalink", excerpt: "Standfirst",
                      body: "Story", publishedAt: "RunDate",
                      coverImage: undefined, coverImageAlt: undefined, featured: undefined,
                      tags: undefined, author: undefined, category: undefined },
            routes: { post: "/writing" },
            site: { name: "CI", url: "https://ci.example" },
            cmsUrl: "http://localhost:5099",
            pageFields: { title: "Heading", slug: "Path", blocks: "Sections", summary: undefined, body: undefined },
          });
          export const blocks = createBlockRegistry(config);
          TS
          printf 'import { createBlogIndex } from "barakopress";\nimport { config } from "@/press.config";\nexport default createBlogIndex(config);\nexport const revalidate = 300;\n' > app/page.tsx
          printf 'import { createBlogPost, createPostMetadata } from "barakopress";\nimport { config } from "@/press.config";\nexport default createBlogPost(config);\nexport const generateMetadata = createPostMetadata(config);\nexport const revalidate = 300;\n' > "app/writing/[slug]/page.tsx"
          mkdir -p app/pages/'[slug]' app/api/blocks
          printf 'import { createPage } from "barakopress";\nimport { blocks, config } from "@/press.config";\nexport default createPage(config, blocks);\nexport const revalidate = 300;\n' > "app/pages/[slug]/page.tsx"
          printf 'import { createBlockSchemaRoute } from "barakopress";\nimport { blocks } from "@/press.config";\nexport const GET = createBlockSchemaRoute(blocks);\n' > app/api/blocks/route.ts
          mkdir -p app/feed.xml
          printf 'import { createFeed } from "barakopress";\nimport { config } from "@/press.config";\nexport const GET = createFeed(config);\nexport const revalidate = 300;\n' > app/feed.xml/route.ts
          cat > app/layout.tsx <<'TSX'
          import "barakopress/styles.css";
          export const metadata = { title: "CI" };
          export default function RootLayout({ children }: { children: React.ReactNode }) {
            return <html lang="en"><body>{children}</body></html>;
          }
          TSX
          npm install --no-audit --no-fund
          npx next build

      - name: The consumer renders the client's model, not the blueprint's
        run: |
          cd /tmp/consumer && npx next start --port 3000 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:3000/ && break; sleep 2; done

          # The index links to /writing, which is where this consumer mounted it.
          curl -s http://localhost:3000/ | grep -q 'href="/writing/ci-article"'
          # The post renders a field the blueprint has never heard of.
          curl -s http://localhost:3000/writing/ci-article | grep -q "An article, not a post"
          # The feed carries the consumer's identity and its route, not the engine's defaults.
          curl -s http://localhost:3000/feed.xml | grep -q "https://ci.example/writing/ci-article"
          curl -s http://localhost:3000/feed.xml | grep -q "<title>CI</title>"

          # A page from blocks stored in the client's own json field, rendered in order, nested, with
          # the unsafe block and the unregistered one left out.
          curl -s http://localhost:3000/pages/ci-landing > /tmp/landing.html
          grep -q "A landing page" /tmp/landing.html
          grep -q "Blocks in <em>order</em>" /tmp/landing.html
          grep -q "Nested call" /tmp/landing.html
          grep -q 'href="/contact-from-a-block"' /tmp/landing.html
          grep -q "Latest writing" /tmp/landing.html
          grep -q "An article, not a post" /tmp/landing.html
          # Not `! grep`: a negated command never trips errexit, so it could not fail this step.
          if grep -q -e "Unsafe call" -e "javascript:" /tmp/landing.html; then
            echo "the unsafe block rendered"
            exit 1
          fi
          # The schema an editor reads is the registry the page rendered with.
          curl -s http://localhost:3000/api/blocks | grep -q '"type":"callToAction"'

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f /tmp/compose.yml logs --tail 80

  look:
    # The look check proving it is a gate. One pair list, run twice: green against pages that match
    # the prototype on disk, red against the same pages with the hero heading in another colour, and
    # the reference, rebuilt and diff images written for the page that moved.
    #
    # A check nobody has watched fail is not yet a gate, and this is where it fails on purpose.
    #
    # look:components is a different kind of check on the same browser: not a page against a design,
    # a block's own compiled markup against what it claims to lay out as. It exists because a real
    # regression here (barakoPress #91: a CSS-only tab strip that broke past two tabs) shipped
    # looking exactly right in the diff and the unit tests, and was only found by rendering it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run look:selftest
      - run: npm run look:components
