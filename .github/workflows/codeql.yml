name: codeql

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: "41 3 * * 1" # weekly, so drift is caught even without a push
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # init reads the workflow run to work out what it is analysing. Without this it fails with
  # "Resource not accessible by integration", which reads like a licensing problem and is not.
  actions: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
